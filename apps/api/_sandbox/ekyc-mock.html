<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>eKYC sandbox</title>
    <link rel="stylesheet" href="/wailib/css/wailib-min-1.12.0.css" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 1rem 1.25rem 2rem;
        background: #f8fafc;
        color: #0f172a;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.25rem;
      }
      .muted {
        color: #64748b;
        font-size: 0.875rem;
        margin-bottom: 1rem;
      }
      .panel {
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 0.75rem;
        padding: 1rem;
        margin-bottom: 1rem;
      }
      label {
        display: block;
        font-size: 0.875rem;
        font-weight: 600;
        margin-bottom: 0.35rem;
      }
      input,
      select,
      button {
        font: inherit;
      }
      input,
      select {
        width: 100%;
        max-width: 28rem;
        padding: 0.5rem 0.65rem;
        border: 1px solid #cbd5e1;
        border-radius: 0.5rem;
        box-sizing: border-box;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        align-items: end;
        margin-bottom: 0.75rem;
      }
      .row > div {
        flex: 1 1 12rem;
      }
      button {
        background: #0f172a;
        color: #fff;
        border: 0;
        border-radius: 0.5rem;
        padding: 0.55rem 1rem;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      button.secondary {
        background: #e2e8f0;
        color: #0f172a;
      }
      #ekyc-container {
        min-height: 420px;
        border: 1px dashed #cbd5e1;
        border-radius: 0.75rem;
        background: #fff;
        overflow: hidden;
      }
      pre {
        background: #0f172a;
        color: #e2e8f0;
        padding: 0.75rem;
        border-radius: 0.5rem;
        overflow: auto;
        font-size: 0.75rem;
        max-height: 320px;
      }
      .status {
        font-size: 0.875rem;
        margin-top: 0.5rem;
      }
      .status.error {
        color: #b91c1c;
      }
      .status.ok {
        color: #15803d;
      }
    </style>
    <!-- Required by wailib-util (HTMLDecode uses $) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="/wailib/js/webrtc-adapter.js"></script>
    <script src="/wailib/js/wailib-util-min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/onnxjs/dist/onnx.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/ort.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/ort.webgpu.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
    <script src="/wailib/js/wailib-sdk-1.12.2.js"></script>
  </head>
  <body>
    <h1>eKYC sandbox</h1>
    <p class="muted">
      Local mock for SigningCloud getToken + WiseAI Web SDK. Requires HTTPS or localhost and camera
      permission. <a href="/qr">QR flow (desktop → phone)</a>
    </p>

    <div class="panel">
      <div class="row">
        <div>
          <label for="email">Signer email</label>
          <input id="email" type="email" value="khai.kit@malcan.io" />
        </div>
        <div>
          <label for="docType">Document type</label>
          <select id="docType">
            <option value="mykad" selected>mykad</option>
            <option value="passport">passport</option>
            <option value="mykadocr">mykadocr (OCR only)</option>
          </select>
        </div>
      </div>
      <div class="row">
        <button id="startBtn" type="button">Start eKYC session</button>
        <button id="hostedBtn" type="button" class="secondary" disabled>Open hosted flow</button>
      </div>
      <div id="sessionStatus" class="status"></div>
    </div>

    <div class="panel">
      <div id="ekyc-container"></div>
    </div>

    <div class="panel">
      <strong>Result</strong>
      <pre id="result">Waiting…</pre>
    </div>

    <script>
      const emailInput = document.getElementById("email");
      const docTypeInput = document.getElementById("docType");
      const startBtn = document.getElementById("startBtn");
      const hostedBtn = document.getElementById("hostedBtn");
      const sessionStatus = document.getElementById("sessionStatus");
      const resultEl = document.getElementById("result");
      const containerId = "ekyc-container";

      let session = null;
      let sdk = null;

      function setStatus(text, kind) {
        sessionStatus.textContent = text;
        sessionStatus.className = "status " + (kind || "");
      }

      function logResult(value) {
        resultEl.textContent =
          typeof value === "string" ? value : JSON.stringify(value, null, 2);
      }

      async function fetchSession() {
        const email = emailInput.value.trim();
        if (!email) throw new Error("Email is required");

        const res = await fetch("/api/ekyc/session?email=" + encodeURIComponent(email));
        const body = await res.json();
        if (!res.ok) {
          throw new Error(body.error || "Failed to create session");
        }
        return body;
      }

      function resetContainer() {
        const el = document.getElementById(containerId);
        el.innerHTML = "";
      }

      async function startEkyc() {
        startBtn.disabled = true;
        hostedBtn.disabled = true;
        setStatus("Requesting session from SigningCloud…", "");

        try {
          session = await fetchSession();
          hostedBtn.disabled = false;

          resetContainer();

          if (typeof WAILib === "undefined" || !WAILib.SDK) {
            throw new Error("WAILib.SDK not loaded — check /wailib script paths");
          }

          sdk = new WAILib.SDK(
            session.token,
            session.url,
            containerId,
            {
              docType: docTypeInput.value,
              showActionButtons: true,
              cameraFit: true,
              enableIDFraudDetection: true,
            },
            "/wailib/models"
          );

          sdk.startCamera();
          setStatus(
            "Session ready. Complete capture in the panel below (token expires in ~30 min).",
            "ok"
          );

          sdk.cameraCapture({
            onSuccess: async function (stage, rawResult) {
              logResult({ stage, rawResult });
              setStatus("Capture complete — decrypting on server…", "");

              try {
                const res = await fetch("/api/ekyc/decrypt", {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ token: session.token, result: rawResult }),
                });
                const body = await res.json();
                if (!res.ok) throw new Error(body.error || "Decrypt failed");
                logResult(body);
                setStatus("eKYC finished.", "ok");
              } catch (err) {
                logResult({ stage, rawResult, decryptError: String(err) });
                setStatus(String(err), "error");
              }
            },
            onError: function (stage, error) {
              logResult({ stage, error: String(error) });
              setStatus("SDK error at stage " + stage, "error");
            },
          });
        } catch (err) {
          setStatus(String(err), "error");
          logResult(String(err));
        } finally {
          startBtn.disabled = false;
        }
      }

      function openHostedFlow() {
        if (!session) return;
        const base = session.url.replace(/\/$/, "");
        window.open(base + "/?token=" + encodeURIComponent(session.token), "_blank");
      }

      startBtn.addEventListener("click", startEkyc);
      hostedBtn.addEventListener("click", openHostedFlow);
    </script>
  </body>
</html>
